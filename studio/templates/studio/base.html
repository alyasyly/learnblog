{% load static %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_BIDI %}rtl{% else %}ltr{% endif %}" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}استودیو{% endblock %} · {{ SITE_NAME }}</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b2a52'/%3E%3Cpath d='M9 23l2-7 9-9 3 3-9 9z' fill='%23f4b400'/%3E%3C/svg%3E">

  <script>
    /* Apply the saved (or system) theme before first paint. */
    (function () {
      try {
        var t = localStorage.getItem("studio-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="preload" href="{% static 'blog/fonts/vazirmatn.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'blog/css/fonts.css' %}">
  <link rel="stylesheet" href="{% static 'studio/css/studio.css' %}">
  <link rel="stylesheet" href="{% static 'blog/css/pygments.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}

  {% if messages %}
    <div class="toasts" role="status" aria-live="polite">
      {% for message in messages %}
        <div class="toast toast--{{ message.level_tag }}">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}

  <script src="{% static 'studio/js/studio.js' %}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
